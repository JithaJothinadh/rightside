<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rightside</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: header; then a two-column stage on wide screens (inputs + answer on the left, the street plan
   on the right, sticky so it stays on screen); on phones the same blocks stack, map right after the answer. */
:root{
  --bg:#f3f4f2; --surface:#ffffff; --fg:#1b1f1d; --muted:#5d6661; --line:#d9ddd9;
  --asphalt:#c9cdc9; --asphalt-edge:#aeb3af; --path:#9aa29d; --block:#e6e8e4;
  --go:#0f8a4a; --go-soft:#d8f0e2; --here:#1f5fd1; --here-soft:#dde7fa; --stop:#d52b1e; --pole:#ffd400; --pole-fg:#1b1f1d; --warn:#b45309; --warn-soft:#fdf0dc;
  --display:"Archivo","Helvetica Neue",Arial,sans-serif; --body:"Inter",system-ui,-apple-system,"Segoe UI","Noto Sans","Noto Sans Arabic","Noto Sans SC","PingFang SC","Microsoft YaHei","Nirmala UI","Noto Sans Tamil","Tamil Sangam MN","Noto Sans Ethiopic","Nyala","Ebrima","Kefa",Tahoma,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#121514; --surface:#1b1f1d; --fg:#eef1ee; --muted:#9ba49f; --line:#2e3431;
  --asphalt:#3a403d; --asphalt-edge:#4b524e; --path:#59615c; --block:#191c1b;
  --go:#3fcf83; --go-soft:#16372a; --here:#7aa7ff; --here-soft:#1c2a45; --stop:#ff5a4c; --pole:#ffd400; --pole-fg:#1b1f1d; --warn:#f5b04c; --warn-soft:#3a2a12; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#121514; --surface:#1b1f1d; --fg:#eef1ee; --muted:#9ba49f; --line:#2e3431;
  --asphalt:#3a403d; --asphalt-edge:#4b524e; --path:#59615c; --block:#191c1b;
  --go:#3fcf83; --go-soft:#16372a; --here:#7aa7ff; --here-soft:#1c2a45; --stop:#ff5a4c; --pole:#ffd400; --pole-fg:#1b1f1d; --warn:#f5b04c; --warn-soft:#3a2a12; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--body);margin:0}
.wrap{max-width:1180px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:14px}
.brand .h{flex:none;width:64px;height:64px;border-radius:50%;background:var(--pole);color:var(--pole-fg);display:grid;place-items:center;font:800 34px var(--display);box-shadow:inset 0 0 0 6px var(--stop)}
h1{font:800 48px/1 var(--display);margin:0;letter-spacing:-.02em}
.tag{color:var(--muted);margin:6px 0 0;font-size:14px}
@media (max-width:480px){.brand .h{width:52px;height:52px;font-size:28px;box-shadow:inset 0 0 0 5px var(--stop)} h1{font-size:38px}}
.topnav{display:flex;align-items:center;gap:14px}
.topnav a{font:600 14px var(--body);color:var(--fg);text-decoration:none;padding:8px 4px;border-bottom:2px solid transparent}
.topnav a:hover{border-bottom-color:var(--pole)}
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
/* phones: one column — the two dropdowns first, then the map (still on screen when the page opens),
   then location and the answer */
@media (max-width:719px){
  .stage{display:flex;flex-direction:column;gap:14px}
  .panel{display:contents}
  .stage .ask{order:1} .stage .mapcard{order:2} .stage .locate{order:3} .stage .coord{order:4} .stage .answer{order:5}
  .stage svg.map{max-height:38vh}
  .mapcard .hint{padding:8px 12px}
  .legend{padding:8px 12px;gap:10px}
}
/* from small laptops up: search + answer on the left, the map beside them on the right */
@media (min-width:720px){
  .stage{grid-template-columns:minmax(0,360px) minmax(0,1fr);align-items:start}
  .stage .ask{grid-template-columns:1fr}
  .stage .mapcard{position:sticky;top:16px}
  .stage svg.map{max-height:calc(100vh - 170px)}
}
@media (min-width:1100px){.stage{grid-template-columns:minmax(0,430px) minmax(0,1fr)}}
.lbl{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:5px}
.lbl label{margin:0}
.info{display:inline-flex;align-items:center;gap:5px;border:0;background:none;padding:0;font:600 12px var(--body);color:var(--here);cursor:pointer;text-align:start}
.info svg{flex:none}
.info span{text-decoration:underline;text-underline-offset:2px}
dialog.sheet{border:1px solid var(--line);border-radius:14px;padding:20px;max-width:min(440px,calc(100vw - 32px));width:100%;background:var(--surface);color:var(--fg);box-shadow:0 20px 60px rgba(0,0,0,.3)}
dialog.sheet::backdrop{background:rgba(10,14,12,.55)}
dialog.sheet h2{font:800 20px/1.2 var(--display);margin:0 0 8px}
dialog.sheet p{margin:0 0 12px;color:var(--muted)}
.stoplist{list-style:none;margin:0 0 12px;padding:0;display:flex;flex-direction:column;gap:6px}
.stoplist button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--fg);font:600 14px var(--body);cursor:pointer;text-align:start}
.stoplist button:hover{border-color:var(--here)}
.stoplist .poles{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
.stoplist .poles i{font:800 10px/18px var(--display);font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--pole);color:var(--pole-fg);text-align:center}
.sheetrow{display:flex;justify-content:space-between;align-items:center;gap:12px}
.sheetrow a{font:600 14px var(--body);color:var(--here)}
.langs{display:flex;gap:4px;flex-wrap:wrap}
.langs button{font:600 12px var(--body);letter-spacing:.04em;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:6px;padding:5px 8px;cursor:pointer}
.langs button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.ask{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.ask{grid-template-columns:1fr}}
label{display:block;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
select,input{width:100%;font:500 14px var(--body);padding:9px 11px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--fg)}
select:focus-visible,input:focus-visible,button:focus-visible{outline:3px solid var(--here);outline-offset:2px}
.langpick{display:flex;align-items:center;gap:8px;margin:0;color:var(--fg)}
.langpick select{width:auto;max-width:62vw;font:600 13px var(--body);padding:7px 9px}
/* Arabic/Persian read right-to-left; the street plan and Latin stop names stay as drawn */
[dir="rtl"] svg.map{direction:ltr}
[dir="rtl"] .say[lang]{direction:ltr;text-align:left}
.combo{position:relative}
.combo input{padding-inline-end:40px}
.clear{position:absolute;inset-inline-end:4px;top:50%;transform:translateY(-50%);width:34px;height:34px;border:0;background:none;color:var(--muted);font-size:22px;line-height:1;cursor:pointer;border-radius:6px}
#destList{position:absolute;z-index:20;left:0;right:0;top:calc(100% + 4px);margin:0;padding:4px;list-style:none;background:var(--surface);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:320px;overflow-y:auto}
#destList li{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:7px 10px;border-radius:6px;cursor:pointer;font-size:13px}
#destList li[aria-selected="true"],#destList li:hover{background:var(--here-soft)}
#destList li .hint{flex:none;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
#destList li.none{cursor:default;color:var(--muted)}
.locate{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;gap:8px;font:600 14px var(--body);padding:10px 14px;border-radius:8px;border:1px solid var(--here);background:var(--here-soft);color:var(--fg);cursor:pointer}
.btn[aria-busy="true"]{opacity:.7;cursor:progress}
.btn svg{color:var(--here)}
#locMsg{font-size:14px;min-width:0;flex:1 1 260px}
#locMsg.warn{color:var(--stop)}
.coord summary{cursor:pointer;color:var(--muted);font-size:13px}
.coord form{display:flex;gap:8px;margin-top:8px}
.coord input{flex:1;min-width:0}
.answer{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
.answer.ok{border-color:var(--go);box-shadow:0 0 0 3px var(--go-soft)}
.big{display:flex;align-items:center;gap:14px}
.pole{flex:none;width:52px;height:52px;border-radius:50%;background:var(--pole);color:var(--pole-fg);display:grid;place-items:center;font:800 26px var(--display);box-shadow:inset 0 0 0 4px var(--go)}
.big h2{font:800 22px/1.2 var(--display);margin:0;text-wrap:balance}
.big p{margin:2px 0 0;color:var(--muted)}
.rides{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.rides li{display:flex;gap:10px;align-items:baseline;flex-wrap:wrap}
.ln{font:700 13px var(--display);min-width:38px;text-align:center;padding:2px 7px;border-radius:5px;background:var(--fg);color:var(--bg);font-variant-numeric:tabular-nums}
/* bus vs tram: an icon + word before the line, and tram line numbers on blue */
.ln.tram{background:var(--here);color:var(--surface)}
.mode{display:inline-flex;align-items:center;gap:4px;font:600 12px var(--body);color:var(--muted);white-space:nowrap}
.mode svg{flex:none;color:var(--fg)}
.mode.tram svg{color:var(--here)}
.ride-line{display:inline-flex;align-items:center;gap:6px}
#destList li .hint{display:inline-flex;align-items:center;gap:4px}
.legend .sq{border-radius:3px}
.legend .lg-pin{display:inline-flex;align-items:center;gap:5px}
.big{flex-wrap:wrap}
.big>div:not(.pole){min-width:0;flex:1 1 170px}
.speak{margin-inline-start:auto;align-self:flex-start;flex:none;display:inline-flex;align-items:center;gap:6px;font:600 13px var(--body);padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--fg);cursor:pointer}
.speak svg{color:var(--here)}
.speak[aria-pressed="true"]{background:var(--here);border-color:var(--here);color:var(--bg)}
.speak[aria-pressed="true"] svg{color:var(--bg)}
.amsg{font-size:13px;color:var(--muted)}
.amsg:empty{display:none}
.prow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.phrase .speak{margin-inline-start:0;background:var(--bg);color:var(--fg);border-color:var(--bg)}
.phrase .amsg{color:var(--bg);opacity:.75}
.amsg a{color:var(--here);font-weight:600;text-underline-offset:2px;white-space:nowrap}
.phrase .amsg a{color:inherit}
.side{margin:2px 0 0;font-weight:600;color:var(--fg)}
/* step-free / accessibility */
.wcrow{grid-column:1/-1;display:flex;align-items:center;gap:10px}
.wcrow input{width:20px;height:20px;margin:0;flex:none;accent-color:var(--here)}
.wcrow label{display:inline-flex;align-items:center;gap:7px;margin:0;font:500 14px var(--body);letter-spacing:0;text-transform:none;color:var(--fg);cursor:pointer}
.wcicon{flex:none;color:var(--here)}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin:0;padding:0;list-style:none}
.chip{display:inline-flex;align-items:center;gap:4px;font:600 12px/1 var(--body);padding:4px 8px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--fg)}
.chip svg{flex:none}
.chip.ok{border-color:var(--go);background:var(--go-soft)}
.chip.lim{border-color:var(--warn);background:var(--warn-soft)}
.chip.no{border-color:var(--stop);color:var(--stop)}
.plat .chips{margin-top:2px}.plat .chip{font-size:11px;padding:3px 6px}
.wcwarn{padding:10px 12px;border-radius:8px;border:1px solid var(--warn);background:var(--warn-soft);font-weight:600}
.wcwarn.no{border-color:var(--stop)}
.wcwarn.unk{border-color:var(--line);background:var(--bg);font-weight:500}
.careful{display:flex;flex-direction:column;gap:4px;padding:10px 12px;border-radius:8px;background:var(--warn-soft);border:1px solid var(--warn)}
.careful b{font-weight:600}
.plat h3 .sd{display:block;font:500 12px var(--body);color:var(--muted)}
.linkbtn{border:0;background:none;padding:0;font:600 13px var(--body);color:var(--here);cursor:pointer;text-decoration:underline;text-underline-offset:2px}
.step{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;background:var(--here-soft)}
.step b{font-weight:600}
.step .dot{flex:none;width:12px;height:12px;border-radius:50%;background:var(--here);margin-top:5px}
.step.same{background:var(--go-soft)} .step.same .dot{background:var(--go)}
.muted{color:var(--muted)}
.mapcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.mapcard .hint{padding:10px 14px;font-size:13px;color:var(--muted);border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}
svg.map{display:block;width:100%;height:auto;max-height:55vh;background:var(--block);touch-action:manipulation}
.st-label{font:600 5.5px var(--body);fill:var(--muted);paint-order:stroke;stroke:var(--block);stroke-width:2px}
.mk{cursor:pointer}
.mk text{font:800 8px var(--display);fill:var(--pole-fg);pointer-events:none}
.legend{display:flex;gap:14px;flex-wrap:wrap;padding:10px 14px;font-size:12px;color:var(--muted);border-top:1px solid var(--line)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.plats{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.plat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 11px;display:flex;flex-direction:column;gap:5px;min-width:0}
.plat.on{border-color:var(--go)} .plat.me{border-color:var(--here)}
.plat h3{margin:0;font:700 13px var(--display);display:flex;align-items:center;gap:7px}
.plat h3 .pl{flex:none;width:20px;height:20px;border-radius:50%;background:var(--pole);color:var(--pole-fg);display:grid;place-items:center;font:800 11px var(--display)}
.plat h3 .sd{font-size:11px}
.plat ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px;font-size:12px;line-height:1.45}
.plat .ln{font-size:11px;min-width:30px;padding:1px 5px}
.phrase{background:var(--fg);color:var(--bg);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:6px}
.phrase .lab{font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;opacity:.7}
.phrase .say{font:700 22px/1.3 var(--display);text-wrap:balance}
.phrase .tr{opacity:.75;font-size:14px}
h4{font:700 14px var(--display);margin:6px 0 0}
footer{font-size:12px;color:var(--muted);line-height:1.6}
footer a{color:inherit}
@keyframes pulse{0%{r:9;opacity:.6}100%{r:20;opacity:0}}
.ring{animation:pulse 1.6s ease-out infinite}
@media (prefers-reduced-motion:reduce){.ring{animation:none;opacity:.35;r:14}}
</style>

<div class="wrap">
  <header>

  <div class="stage">

      <span class="lg-pin"><svg width="12" height="17" viewBox="-8 -29.5 16 22" aria-hidden="true"><path d="M0,-8.6 C-3,-12 -7,-15.5 -7,-20 A7,7 0 1 1 7,-20 C7,-15.5 3,-12 0,-8.6Z" fill="var(--here)"/><circle cx="0" cy="-22.4" r="1.9" fill="var(--surface)"/><path d="M-3.4,-16.2a3.4,3.4 0 0 1 6.8,0Z" fill="var(--surface)"/></svg><span data-t="lgHere"></span></span>

<script>
const T={
 en:{tagline:"Find the right side of the road for your bus or tram",stopLabel:"Stop",destLabel:"Where are you going?",destPh:"Type a stop, e.g. Seebach",

let DATA,lang="en",stop,here=null;

let wcMode=false;  // "I use a wheelchair or walking aid": step-free warnings, crossings with lights first

const $=id=>document.getElementById(id);
const fmt=(s,o)=>s.replace(/\{(\w+)\}/g,(_,k)=>o[k]??"");
const norm=s=>s.normalize("NFD").replace(/\p{M}/gu,"").toLowerCase().trim();
const t=()=>T[lang];
const store={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};

function dirWord(b){return t().dirs[Math.round(b/45)%8]}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}

function matches(dest){
  const q=norm(dest); if(!q) return null;
  const find=test=>{const out=[];
    for(const p of stop.platforms) for(const r of p.routes){const i=r.via.findIndex(v=>test(norm(v))); if(i>=0) out.push({p,r,n:i+1,name:r.via[i]})}
    return out};
  // an exact stop name always beats a partial one ("Bahnhof" must not land on "Bahnhofstrasse")
  let out=find(v=>v===q); if(!out.length&&q.length>=3) out=find(v=>v.startsWith(q));
  out.sort((a,b)=>a.n-b.n);
  return out;
}

function renderAnswer(){
  const el=$("answer"),dest=$("dest").value.trim(),L=t();
  const m=matches(dest);
  el.classList.toggle("ok",!!(m&&m.length));
  if(!m){el.innerHTML=`<p class="muted">${L.empty}</p>`;drawMap(null);renderPlats(null);renderPhrase(dest);return null}
  if(!m.length){el.innerHTML=`<p>${fmt(L.noMatch,{s:esc(stop.name),d:esc(dest)})}</p>`;drawMap(null);renderPlats(null);renderPhrase(dest);return null}
  const best=m[0].p, same=m.filter(x=>x.p===best), name=m[0].name;
  const rides=same.map(x=>`<li><span class="ride-line">${modeTag(x.r.mode)}${lineBadge(x.r)}</span><span>${L.towards} <b>${esc(x.r.to)}</b> · ${L.next}: ${esc(x.r.next)}</span></li>`).join("");
  let walk;
  if(!here) walk=`<div class="step"><span class="dot"></span><span>${L.pickHere}</span></div>`;
  else if(here.id===best.id) walk=`<div class="step same"><span class="dot"></span><span><b>${L.same}</b></span></div>`;
  else{
    const z=nearestCrossing(here,best);
    let c=z?fmt(L.crossZebra,{z:z.d}):L.crossNone;
    if(z&&wcMode){ // wheelchair: the crossing with lights we picked, and what we know about its kerbs
      c=(z.sig?fmt(L.crossSignals,{z:z.d}):fmt(L.crossZebra,{z:z.d}))+" "+(["lowered","flush"].includes(z.kerb)?L.kerbOk:L.kerbUnknown);
    }
    walk=`<div class="step"><span class="dot"></span><span>${fmt(L.cross,{a:here.label,b:best.label,m:Math.round(dist(here,best)),c})}</span></div>`;
  }
  const other=[...new Set(m.filter(x=>x.p!==best).map(x=>x.p.label))];
  // a twin across the street going the other way is the classic mix-up: warn, and give a check that needs no German
  const tw=twinsOf(best)[0];
  const careful=tw?`<div class="careful"><b>${fmt(L.twinWarn,{q:esc(tw.label),m:Math.round(dist(tw,best)),o:esc(tw.routes[0].to)})}</b><span>${fmt(L.signCheck,{l:esc(same[0].r.line),d:esc(same[0].r.to),o:esc(tw.routes[0].to)})}</span></div>`:"";
  const side=sideLabel(best);
  // step-free: with the switch on, say plainly when this stop is limited, not step-free, or unknown
  const wc=(best.acc||{}).wc;
  const wcwarn=!wcMode||wc==="yes"?"":wc==="limited"?`<div class="wcwarn">${esc(L.wcLimited)}</div>`:wc==="no"?`<div class="wcwarn no">${esc(L.wcNo)}</div>`:`<div class="wcwarn unk">${esc(L.wcUnknown)}</div>`;
  el.innerHTML=`<div class="big"><div class="pole" aria-hidden="true">${esc(best.label)}</div><div><h2>${fmt(L.waitAt,{p:esc(best.label)})}</h2>${side?`<p class="side">${esc(side)}</p>`:""}<p>${fmt(L.waitSub,{n:m[0].n,d:esc(name)})} · ${fmt(L.travels,{dir:dirWord(departBearing(best,same[0].r))})}</p></div>${speakBtn("ansListen","answer",L.listen)}</div><span class="amsg" id="ansMsg" aria-live="polite"></span>
  ${accChips(best)}${wcwarn}<ul class="rides">${rides}</ul>${careful}${walk}${other.length?`<p class="muted" style="margin:0;font-size:13px">+ ${other.map(o=>fmt(L.poleN,{p:o})).join(", ")}</p>`:""}`;
  // what "Listen" says: the card, top to bottom, in the viewer's language
  const q=s=>(el.querySelector(s)?.textContent||"").trim();
  answerSpeech=forSpeech([q("h2"),q(".side"),q(".big h2 ~ p:last-of-type"),
    [...el.querySelectorAll(":scope > .chips .chip")].map(c=>c.textContent.trim()).join(", "),q(".wcwarn"),
    ...same.map(x=>`${modeWord(x.r.mode)} ${x.r.line}, ${L.towards} ${x.r.to}. ${L.next}: ${x.r.next}`),
    q(".careful b"),q(".careful span"),q(".step")].filter(Boolean).map(s=>s.replace(/[.。።]$/,"")).join(". ")+".");
  drawMap(best);renderPlats(best);renderPhrase(name);
  return best;
}

function pickVoice(tag){

  const exact=VOICES.filter(v=>vl(v)===want);
  if(exact.length)return exact.find(v=>v.localService)||exact[0];
  for(const a of alts){

// one utterance per sentence: long single utterances get cut off in Chrome

function speakBtn(id,kind,label){

// spoken text: "·" becomes a pause, "13 m" becomes "13 metres" so voices don't read "em"

function forSpeech(s){const L=t();return s.replace(/\s*·\s*/g,". ")

  const L=t();stopSpeech();audioMsg(kind,"");

  if(TTS&&ttsOff){audioMsg(kind,L.audioOff);return}
  const base=tag.split("-")[0],alts=[base,...(SPEECH_ALT[base]||[])];
  const viaClaude=language=>{
    setSpeaking(kind);
    TTS.t.speak(text,language?{language,rate:0.9}:{rate:0.9}).then(()=>{if(speaking===kind)setSpeaking(null)}).catch(e=>{
      if(e&&(e.code==="not_granted"||e.code==="unavailable")){ttsOff=true;audioMsg(kind,L.audioOff)}

  };

  if(TTS&&TTS.langs&&TTS.langs.some(l=>alts.includes(l))){

// ---- twin stops and street side -----------------------------------------
const angDiff=(a,b)=>Math.abs(((a-b+540)%360)-180);
// Which way a line LEAVES this pole. The data's bearing is a straight line to the next stop, which can be
// hundreds of metres away round a corner (Bern Zytglogge E: trams go north up Theaterplatz, then turn west),
// so that arrow cut through buildings. Instead: follow the street the pole stands on (nearest drivable street
// within 12 m), in whichever of its two directions is closer to the next stop. No street nearby: straight line.
function departBearing(p,r){
  p._dep=p._dep||{};const key=r.line+">"+r.to+">"+r.next;
  if(key in p._dep)return p._dep[key];
  let best=null;
  for(const w of stop.streets){
    if(!ROADS.has(w.k)||w.k==="service")continue;
    for(let i=1;i<w.p.length;i++){
      const [ax,ay]=w.p[i-1],[bx,by]=w.p[i],dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy;
      if(L2<1)continue;
      const u=Math.max(0,Math.min(1,((p.x-ax)*dx+(p.y-ay)*dy)/L2));
      const d=Math.hypot(p.x-(ax+u*dx),p.y-(ay+u*dy));
      const qx=ax+u*dx,qy=ay+u*dy;
      if(d<12&&(!best||d<best.d))best={d,brg:(Math.atan2(dx,-dy)*180/Math.PI+360)%360,side:(Math.atan2(p.x-qx,-(p.y-qy))*180/Math.PI+360)%360};
    }
  }
  let out=r.bearing;
  if(best){
    const a=best.brg,b=(best.brg+180)%360;
    const towardNext=angDiff(a,r.bearing)<=angDiff(b,r.bearing)?a:b;
    // Switzerland drives on the right: the bus leaves in the direction that has its stop on the RIGHT.
    // Same answer for every line at this pole, even when the next stop is round a corner.
    const keepsRight=angDiff(best.side,(a+90)%360)<90?a:b;
    // Only trust the street when it roughly agrees with where the next stop is; on big open squares
    // (Basel Aeschenplatz) the nearest street can be the wrong one, so keep the straight line there.
    if(best.d>=1.5){if(angDiff(keepsRight,r.bearing)<=100)out=keepsRight}   // kerbside stop
    else if(angDiff(towardNext,r.bearing)<=100)out=towardNext;               // on the centre line (tram island)
  }
  return p._dep[key]=Math.round(out);
}

// same-named poles close to the target whose buses all leave the opposite way
function twinsOf(target){
  const tb=target.routes.map(r=>departBearing(target,r));
  return stop.platforms.filter(p=>p!==target&&dist(p,target)<40&&p.routes.every(r=>tb.every(b=>angDiff(b,departBearing(p,r))>100)))
    .sort((a,b)=>dist(a,target)-dist(b,target));
}
// which side of the nearest street a pole stands on, from the OSM centreline
const ROADS=new Set(["trunk","primary","secondary","tertiary","residential","unclassified","living_street","pedestrian","service"]);
function sideOf(p){
  if(p._side!==undefined) return p._side;
  let best=null;
  for(const w of stop.streets){ if(!ROADS.has(w.k)) continue;
    for(let i=1;i<w.p.length;i++){
      const [ax,ay]=w.p[i-1],[bx,by]=w.p[i],dx=bx-ax,dy=by-ay,L2=dx*dx+dy*dy||1;
      const u=Math.max(0,Math.min(1,((p.x-ax)*dx+(p.y-ay)*dy)/L2)),qx=ax+u*dx,qy=ay+u*dy;
      const d=Math.hypot(p.x-qx,p.y-qy)+(w.k==="service"?6:0)+(w.n?0:4); // prefer real, named streets
      if(!best||d<best.d) best={d,qx,qy,n:w.n};

  if(best&&best.d<30&&Math.hypot(p.x-best.qx,p.y-best.qy)>0.5){
    const b=(Math.atan2(p.x-best.qx,-(p.y-best.qy))*180/Math.PI+360)%360;

// crossing to use between two poles: nearest to the midpoint; in wheelchair mode, one with traffic

function nearestCrossing(a,b){
  const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};

  if(!list.length) return null;

function hav(a1,o1,a2,o2){const R=6371000,r=Math.PI/180,da=(a2-a1)*r,dl=(o2-o1)*r;
  const q=Math.sin(da/2)**2+Math.cos(a1*r)*Math.cos(a2*r)*Math.sin(dl/2)**2;return 2*R*Math.asin(Math.sqrt(q))}
function proj(lat,lon){return [(lon-stop.lon)*111320*Math.cos(stop.lat*Math.PI/180),-(lat-stop.lat)*110540]}

function applyPosition(lat,lon,acc){
  me={lat,lon,acc};
  let best=null;
  DATA.stops.forEach((s,i)=>s.platforms.forEach(p=>{const d=hav(lat,lon,p.lat,p.lon);if(!best||d<best.d)best={i,p,d}}));
  const s=DATA.stops[best.i],near=best.d<400;
  // second-closest pole of the same stop: if GPS error is bigger than half the gap, we can't tell the sides apart
  const gap=Math.min(...s.platforms.filter(p=>p!==best.p).map(p=>hav(lat,lon,p.lat,p.lon)))-best.d;
  if(s!==stop){$("dest").value="";setStop(best.i,true,near?best.p:null)}
  else{if(near)here=best.p;renderAnswer()}
  locState=near?{k:"near",d:best.d,p:best.p.label,s:s.name,rough:acc>Math.max(8,gap/2),a:acc}:{k:"far",d:best.d,s:s.name};
  renderLoc();
}
function renderLoc(){
  const el=$("locMsg"),L=t();el.className="";
  if(!locState){el.textContent="";return}
  const S=locState;
  if(S.k==="near")el.textContent=fmt(L.locNear,{d:Math.round(S.d),s:S.s,p:S.p})+(S.rough?fmt(L.locRough,{a:Math.round(S.a)}):"");
  else if(S.k==="far")el.textContent=fmt(L.locFar,{s:S.s,km:(S.d/1000).toFixed(1)});
  else{el.textContent=L[S.k];if(S.k!=="locWait")el.className="warn"}
  $("locBtn").setAttribute("aria-busy",S.k==="locWait");
}
function stopWatch(){if(watchId!=null){try{navigator.geolocation.clearWatch(watchId)}catch(e){}watchId=null}}
function locate(){
  stopWatch();

  if(!("geolocation" in navigator)){fail("locNA");return}
  fail("locWait");
  try{
    watchId=navigator.geolocation.watchPosition(
      pos=>applyPosition(pos.coords.latitude,pos.coords.longitude,pos.coords.accuracy||50),
      err=>{stopWatch();fail(err.code===1?"locDenied":"locNA")},
      {enableHighAccuracy:true,maximumAge:5000,timeout:15000});

// accepts "46.80, 7.16", OSM "#map=18/46.80/7.16", Google "@46.80,7.16"
function parseCoords(s){
  const m=s.match(/(-?\d{1,2}\.\d+)\s*[,/ ]\s*(-?\d{1,3}\.\d+)/);
  if(!m)return null;const a=+m[1],b=+m[2];

const W={trunk:16,primary:15,secondary:13,tertiary:11,residential:8,unclassified:8,living_street:7,pedestrian:7,service:5,footway:1.6};

  // with an answer, frame just your stop, its twin and where you stand; otherwise every pole
  let pts=stop.platforms;
  if(target&&!showAll){pts=[target,...twinsOf(target)];if(here&&here!==target&&dist(here,target)<120)pts.push(here)}
  const focused=pts.length<stop.platforms.length;
  const zb=$("zoomBtn");zb.hidden=!target||(!focused&&!showAll);zb.textContent=showAll?L.zoomMine:L.zoomAll;
  const xs=pts.map(p=>p.x),ys=pts.map(p=>p.y);

  const h=Math.min(150,Math.max(focused?32:55,Math.max(...xs.map(x=>Math.abs(x-cx)),...ys.map(y=>Math.abs(y-cy)))+(focused?22:40)));
  const k=h/150;

  for(const w of roads) s+=`<path d="${d(w)}" fill="none" stroke="var(--asphalt)" stroke-width="${W[w.k]}" stroke-linecap="round" stroke-linejoin="round"/>`;

  const xs2=(stop.xings&&stop.xings.length)?stop.xings:(stop.crossings||[]).map(([x,y])=>({x,y}));
  for(const c of xs2) s+=wcMode&&c.sig
    ?`<g transform="translate(${c.x},${c.y})"><rect x="-2.4" y="-2.4" width="4.8" height="4.8" rx="1" fill="var(--here)" stroke="var(--surface)" stroke-width="0.7"/></g>`
    :`<g transform="translate(${c.x},${c.y})"><rect x="-2" y="-2" width="4" height="4" fill="none" stroke="var(--surface)" stroke-width="0.8" stroke-dasharray="0.8 0.7"/></g>`;
  // street names: one label per name, on its longest visible segment
  const seen=new Set();
  for(const w of [...roads].sort((a,b)=>W[b.k]-W[a.k])){
    if(!w.n||seen.has(w.n)||W[w.k]<8) continue;
    let bs=null,bl=0;
    for(let i=1;i<w.p.length;i++){const [x1,y1]=w.p[i-1],[x2,y2]=w.p[i];const l=Math.hypot(x2-x1,y2-y1);const mx=(x1+x2)/2,my=(y1+y2)/2;if(l>bl&&Math.abs(mx-cx)<h*.85&&Math.abs(my-cy)<h*.9){bl=l;bs=[x1,y1,x2,y2]}}
    if(!bs||bl<35*k) continue; seen.add(w.n);
    let a=Math.atan2(bs[3]-bs[1],bs[2]-bs[0])*180/Math.PI; if(a>90)a-=180; if(a<-90)a+=180;
    s+=`<text class="st-label" text-anchor="middle" dominant-baseline="middle" style="font-size:${5.5*k}px;stroke-width:${2*k}px" transform="translate(${(bs[0]+bs[2])/2},${(bs[1]+bs[3])/2}) rotate(${a})">${esc(w.n)}</text>`;
  }
  // departure arrows
  for(const p of stop.platforms){
    const bs=[...new Set(p.routes.map(r=>Math.round(departBearing(p,r)/20)*20))];
    const col=target&&p.id===target.id?"var(--go)":"var(--fg)";
    for(const b of bs){const r=b*Math.PI/180,dx=Math.sin(r),dy=-Math.cos(r);
      const x1=p.x+dx*10*k,y1=p.y+dy*10*k,x2=p.x+dx*24*k,y2=p.y+dy*24*k;
      s+=`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${col}" stroke-width="${1.6*k}" stroke-linecap="round" marker-end="url(#ah${col.includes("go")?"g":"f"})"/>`}
  }
  if(me){const [mx,my]=proj(me.lat,me.lon);
    if(Math.abs(mx-cx)<h*1.2&&Math.abs(my-cy)<h*1.2)
      s+=`<g pointer-events="none"><circle cx="${mx}" cy="${my}" r="${Math.min(me.acc,300)}" fill="var(--here)" opacity=".12"/><circle cx="${mx}" cy="${my}" r="${4*k}" fill="var(--here)" stroke="var(--surface)" stroke-width="${1.5*k}"/></g>`}
  for(const p of stop.platforms){
    const isT=target&&p.id===target.id,isH=here&&p.id===here.id;
    const ring=isT?"var(--go)":isH?"var(--here)":"var(--stop)";
    s+=`<g class="mk" tabindex="0" role="button" aria-label="${esc(fmt(L.poleN,{p:p.label}))}" data-id="${p.id}" transform="translate(${p.x},${p.y}) scale(${k})">
      ${isT?`<circle class="ring" r="9" fill="var(--go)"/>`:""}
      ${(()=>{const r=isT||isH?8.5:7,sw=isT||isH?2.6:1.6; // tram-only poles are rounded squares, bus poles circles
        return poleIsTram(p)?`<rect x="${-r}" y="${-r}" width="${2*r}" height="${2*r}" rx="${r*.38}" fill="var(--pole)" stroke="${ring}" stroke-width="${sw}"/>`
          :`<circle r="${r}" fill="var(--pole)" stroke="${ring}" stroke-width="${sw}"/>`})()}
      <text text-anchor="middle" dominant-baseline="central" style="font-size:${isT||isH?9:8}px">${esc(p.label)}</text>${markerIcons(isT,isH)}</g>`;
  }
  // north + scale
  const sb=h>100?50:20;
  s+=`<g transform="translate(${cx+h-18*k},${cy-h+22*k}) scale(${k})"><path d="M0,-9 L5,5 L0,2 L-5,5Z" fill="var(--fg)"/><text y="14" text-anchor="middle" style="font:700 7px var(--display);fill:var(--fg)">N</text></g>`;
  s+=`<g transform="translate(${cx-h+10*k},${cy+h-12*k})"><rect width="${sb}" height="${2.5*k}" fill="var(--fg)"/><text x="${sb+4*k}" y="${3*k}" style="font:600 ${6*k}px var(--body);fill:var(--muted)">${sb} m</text></g>`;
  svg.innerHTML=`<defs><marker id="ahf" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10Z" fill="var(--fg)"/></marker><marker id="ahg" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="5" markerHeight="5" orient="auto"><path d="M0,0L10,5L0,10Z" fill="var(--go)"/></marker></defs>`+s;
  svg.setAttribute("aria-label",stop.name);
  // a manual tap overrides live tracking
  svg.querySelectorAll(".mk").forEach(g=>{const f=()=>{stopWatch();here=stop.platforms.find(p=>p.id===g.dataset.id);renderAnswer()};g.addEventListener("click",f);g.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();f()}})});
}

function renderPlats(target){
  const L=t();
  $("plats").innerHTML=stop.platforms.map(p=>`<div class="plat${target&&p.id===target.id?" on":""}${here&&p.id===here.id?" me":""}">
    <h3><span class="pl">${esc(p.label)}</span><span>${fmt(L.poleN,{p:esc(p.label)})}${sideLabel(p)?`<small class="sd">${esc(sideLabel(p))}</small>`:""}</span></h3>${accChips(p)}
    <ul>${p.routes.map(r=>`<li>${modeIcon(r.mode,12)} ${lineBadge(r)} ${L.towards} <b>${esc(r.to)}</b><br><span class="muted">${L.next}: ${esc(r.next)} · ${dirWord(departBearing(p,r))}</span></li>`).join("")}</ul></div>`).join("");
}

function renderPhrase(dest){
  const L=t(),d=dest||stop.platforms[0].routes[0].to,rl=REGION_LANG(stop.name);
  phraseSpeech={text:fmt(LOCAL[rl],{d}),tag:SPEECH_TAG[rl]};
  $("phrase").innerHTML=`<span class="lab">${L.sayLab}</span><span class="say" lang="${rl}">${esc(fmt(LOCAL[rl],{d}))}</span>${lang!==rl?`<span class="tr">${esc(fmt(L.sayTr,{d}))}</span>`:""}<div class="prow">${speakBtn("phraseListen","phrase",L.playPhrase)}<span class="amsg" id="phraseMsg" aria-live="polite"></span></div>`;
}

function esc(s){return String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}

function applyLang(){
  stopSpeech();
  const L=t(); document.documentElement.lang=lang;
  document.querySelectorAll("[data-t]").forEach(e=>{e.textContent=fmt(L[e.dataset.t],{s:stop.name.split(",").pop().trim()})});
  $("dest").placeholder=fmt(L.destPh,{});
  document.documentElement.dir=RTL.has(lang)?"rtl":"ltr";
  $("langSel").value=lang;
  renderLoc();
  $("foot").innerHTML=fmt(L.foot,{date:DATA.generated})+` <a href="https://www.openstreetmap.org/#map=18/${stop.lat}/${stop.lon}" target="_blank" rel="noopener">openstreetmap.org</a>`;
  renderAnswer();
}

function setStop(i,keepDest,hereP){
  stop=DATA.stops[i]; here=null; showAll=false; $("stop").value=i;
  // every reachable stop, with the pole + line that gets there in the fewest stops
  const byName={};
  for(const p of stop.platforms) for(const r of p.routes) r.via.forEach((v,i)=>{
    if(!byName[v]||i+1<byName[v].n) byName[v]={name:v,label:p.label,line:r.line,mode:r.mode,n:i+1}});
  DESTS=Object.values(byName).sort((a,b)=>a.name.localeCompare(b.name));
  closeList();
  if(!keepDest){ // example destination: the end of the first line
    const v=stop.platforms[stop.platforms.length-1].routes[0].via; $("dest").value=v[Math.min(3,v.length-1)];
  }
  // example "you are here": the pole farthest from the answer, to show the crossing help
  const best=(matches($("dest").value)||[])[0];
  if(hereP) here=hereP;
  else if(best) here=stop.platforms.slice().sort((a,b)=>dist(b,best.p)-dist(a,best.p))[0];
  applyLang();
}

async function boot(){
  DATA=window.STOPS_DATA||await (await fetch("stops.json")).json();
  $("langSel").innerHTML=Object.keys(LANG_NAMES).map(l=>`<option value="${l}" lang="${l}">${LANG_NAMES[l]}</option>`).join("");
  $("langSel").addEventListener("change",e=>{lang=e.target.value;store.set("ws-lang",lang);applyLang()});
  // remembered choice, else the first of the phone's languages we have
  const saved=store.get("ws-lang");
  if(saved&&T[saved]) lang=saved;
  else for(const full of (navigator.languages||[navigator.language||"en"])){
    const c=String(full).toLowerCase().split("-")[0],m=T[c]?c:LANG_ALIAS[c];
    if(m){lang=m;break}
  }
  $("stop").innerHTML=DATA.stops.map((s,i)=>`<option value="${i}">${esc(s.name)} · ${s.platforms.length}</option>`).join("");
  $("stop").addEventListener("change",e=>{stopWatch();me=null;locState=null;setStop(+e.target.value)});
  $("locBtn").addEventListener("click",locate);
  // speech: resolve both engines up front so a tap can speak straight away
  if("speechSynthesis" in window){loadVoices();try{speechSynthesis.addEventListener("voiceschanged",loadVoices)}catch(e){}}
  if(window.claude?.use) window.claude.use("tts").then(async tt=>{
    if(!tt)return;
    let langs;try{langs=await tt.languages?.()}catch(e){}
    TTS={t:tt,langs:Array.isArray(langs)&&langs.length?langs:null};
    try{tt.onState(({state,reason})=>{if(state==="idle"){if(reason==="not_granted"||reason==="unavailable")ttsOff=true;if(speaking)setSpeaking(null)}})}catch(e){}
  }).catch(()=>{});
  document.addEventListener("click",e=>{
    const b=e.target.closest(".speak");if(!b)return;
    const kind=b.dataset.kind;
    if(speaking===kind){stopSpeech();return}
    if(kind==="answer")speakText("answer",answerSpeech,SPEECH_TAG[lang]);
    else if(phraseSpeech)speakText("phrase",phraseSpeech.text,phraseSpeech.tag);
  });
  $("zoomBtn").addEventListener("click",()=>{showAll=!showAll;renderAnswer()});
  // wheelchair / walking-aid switch, remembered on this device
  wcMode=store.get("ws-wc")==="1";$("wcToggle").checked=wcMode;
  $("wcToggle").addEventListener("change",e=>{wcMode=e.target.checked;store.set("ws-wc",wcMode?"1":"0");renderAnswer()});
  // "Which stops are included?": the prototype's stop list; tapping one opens it
  $("infoBtn").addEventListener("click",()=>{
    const L=t(),dlg=$("infoDlg");
    $("infoDlgTitle").textContent=L.infoTitle;
    $("infoDlgBody").textContent=fmt(L.infoBody,{n:DATA.stops.length});
    $("infoDlgMore").textContent=L.infoMore;
    $("infoDlgFaq").textContent=L.faq;
    $("infoDlgClose").textContent=L.close;
    $("infoDlgList").innerHTML=DATA.stops.map((s,i)=>`<li><button type="button" data-i="${i}"><span>${esc(s.name)}</span><span class="poles" aria-label="${s.platforms.length}">${s.platforms.map(p=>`<i>${esc(p.label)}</i>`).join("")}</span></button></li>`).join("");
    if(dlg.showModal)dlg.showModal();else dlg.setAttribute("open","");
  });
  $("infoDlgList").addEventListener("click",e=>{
    const b=e.target.closest("button[data-i]");if(!b)return;
    stopWatch();me=null;locState=null;$("infoDlg").close();setStop(+b.dataset.i);
  });
  $("infoDlgClose").addEventListener("click",()=>$("infoDlg").close());
  $("infoDlg").addEventListener("click",e=>{if(e.target===$("infoDlg"))$("infoDlg").close()}); // tap outside closes
  $("coordForm").addEventListener("submit",e=>{e.preventDefault();stopWatch();
    const c=parseCoords($("coord").value);
    if(!c){locState={k:"locBad"};renderLoc();return}
    applyPosition(c[0],c[1],3)}); // a typed point is treated as precise
  const dest=$("dest");
  // tapping the box shows ALL destinations (the pre-filled example is selected, so typing replaces it)
  dest.addEventListener("focus",()=>{dest.select();openList("")});
  dest.addEventListener("click",()=>{if($("destList").hidden)openList("")});
  dest.addEventListener("input",()=>{openList(dest.value);renderAnswer()});
  dest.addEventListener("keydown",e=>{
    if(e.key==="ArrowDown"){e.preventDefault();move(1)}
    else if(e.key==="ArrowUp"){e.preventDefault();move(-1)}
    else if(e.key==="Enter"){if(active>=0){e.preventDefault();pick(active)}else if(shown.length===1){e.preventDefault();pick(0)}else closeList()}
    else if(e.key==="Escape"&&!$("destList").hidden){e.preventDefault();closeList()}}); // claim Escape only when it closes the list
  dest.addEventListener("blur",()=>setTimeout(closeList,150));
  $("destList").addEventListener("mousedown",e=>{e.preventDefault();const li=e.target.closest("li[data-i]");if(li)pick(+li.dataset.i)});
  $("destClear").addEventListener("click",()=>{dest.value="";renderAnswer();dest.focus();openList("")});
  // open on Bern, Zytglogge: eight poles share the name, so the side really matters
  const start=Math.max(0,DATA.stops.findIndex(s=>s.name.startsWith("Bern")));
  $("stop").value=start; setStop(start);
}
boot().catch(e=>{$("answer").textContent="Could not load stop data: "+e.message});
</script>
